<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Storm</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  body { height: 100%; }
  #scene { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; }
  #scroll-host { height: 300vh; }
  #scroll-hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.5);
    font-family: sans-serif;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 2;
  }

  /* ---------------------------------------------------------------------
     Theo — virtual assistant demo. Vanilla CSS/JS: this file is a
     standalone static page (no build step, no React), not the app's
     spring-only animation system, so ordinary transitions/keyframes are
     the right tool here.
  --------------------------------------------------------------------- */
  #theo-hitzone {
    position: fixed;
    top: 0; left: 0;
    width: 0; height: 0;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 1px solid transparent;
    background: transparent;
    cursor: pointer;
    z-index: 5;
    transition: border-color 0.3s ease, background 0.3s ease;
  }
  #theo-hitzone:hover,
  #theo-hitzone:focus-visible {
    border-color: rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.03);
  }
  #theo-hitzone:focus-visible { outline: none; }

  #theo-hint {
    position: fixed;
    top: 0; left: 0;
    transform: translate(-50%, -50%) scale(0.9);
    z-index: 6;
    pointer-events: none;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.8);
    background: rgba(20, 8, 16, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.14);
    padding: 7px 14px;
    border-radius: 999px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #theo-hint.visible { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #theo-hint.pulse { animation: theo-hint-pulse 2.6s ease-in-out infinite; }
  @keyframes theo-hint-pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.06); }
  }

  #theo-bubble-wrap {
    position: fixed;
    top: 0; left: 0;
    transform: translate(-50%, calc(-100% - 2px)) scale(0.9);
    transform-origin: 50% 100%;
    z-index: 7;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
    opacity: 0;
    /* Exit curve: plain decelerate, no overshoot (used when .visible is
       removed — the entrance's springy pop-in curve lives on .visible
       below, so leaving doesn't wobble on the way out). */
    transition: opacity 0.28s ease, transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
    max-width: min(82vw, 320px);
  }
  #theo-bubble-wrap.visible {
    opacity: 1;
    transform: translate(-50%, calc(-100% - 10px)) scale(1);
    pointer-events: auto; /* only while shown, so hover-to-pause can work without blocking the orb underneath while hidden */
    transition: opacity 0.32s ease, transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #theo-name {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.5);
    margin-bottom: 7px;
  }
  #theo-bubble {
    position: relative;
    background: rgba(255, 255, 255, 0.97);
    color: #0b0b0c;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.42;
    padding: 12px 16px;
    border-radius: 20px;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.38), 0 2px 10px rgba(0, 0, 0, 0.22);
    backdrop-filter: blur(24px) saturate(1.7);
    -webkit-backdrop-filter: blur(24px) saturate(1.7);
  }
  #theo-bubble::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: -7px;
    width: 14px;
    height: 14px;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.97);
    clip-path: polygon(50% 100%, 0 0, 100% 0);
    filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.14));
  }

  @media (prefers-reduced-motion: reduce) {
    #theo-hint, #theo-bubble-wrap { transition-duration: 0.01ms !important; }
    #theo-hint.pulse { animation: none; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="scroll-host"></div>
<div id="scroll-hint">scroll &darr;</div>

<div id="theo-hitzone" role="button" tabindex="0" aria-label="Mit Theo, dem virtuellen Assistenten von Mirage Data, chatten"></div>
<div id="theo-hint">👋 Klick mich</div>
<div id="theo-bubble-wrap" aria-live="polite">
  <span id="theo-name">Theo · Mirage Data</span>
  <div id="theo-bubble"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.143.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.143.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js'
import { GammaCorrectionShader } from 'three/addons/shaders/GammaCorrectionShader.js'
import { CopyShader } from 'three/addons/shaders/CopyShader.js'

function hexToVec3(hex) {
  const n = parseInt(hex.slice(1), 16)
  return new THREE.Vector3(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255)
}

const CONFIG = {
  bgColor: '#1a0418',
  flameColor: '#ff2d6b',
  flameColor2: '#ffd36b',
  flameAmt: 0.2,
  atmoColor: '#ff7ab0',
  atmoCount: 300,
  atmoSize: 24,
  atmoSpeed: 1.0,
  coreColor: '#6a0a2a',
  midColor: '#ff2d6b',
  rimColor: '#ffd36b',
  opacity: 2,
  pointSize: 80,
  brightness: 1.6,
  spin: 0.03,
  blowUp: 0,
  repelRadius: 1.4,
  repelStrength: 4,
  scrollDive: 3,
  scrollGrow: 0.5,
  scrollSpin: 0.6,
  parallax: 0.7,
}

const LAYERS = { NONE: 0, TORUS_SCENE: 1, BLOOM_SCENE: 2, ENTIRE_SCENE: 3 }

// Clamp to 1px so a canvas measured before the page has laid out (0×0)
// never becomes the renderer's/composers' permanent backing size.
const initW = Math.max(1, window.innerWidth), initH = Math.max(1, window.innerHeight)

const canvas = document.getElementById('scene')
const renderer = new THREE.WebGL1Renderer({ canvas, antialias: true })
renderer.setPixelRatio(window.devicePixelRatio)
renderer.setSize(initW, initH)
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.VSMShadowMap

const scene = new THREE.Scene()
scene.background = new THREE.Color(0x000000)
scene.fog = new THREE.Fog(0x000000, 0, 15)

const camera = new THREE.PerspectiveCamera(45, initW / initH, 0.1, 80)
camera.position.set(0, 0, 7)
camera.layers.enable(LAYERS.TORUS_SCENE)
camera.layers.enable(LAYERS.BLOOM_SCENE)
camera.layers.enable(LAYERS.ENTIRE_SCENE)
scene.add(camera)

// ---------------------------------------------------------------------------
// Pointer / cursor void tracking
// ---------------------------------------------------------------------------
const POINTER = { ndc: new THREE.Vector2(0, 0), world: new THREE.Vector3(), activity: 0, active: false, lastMove: performance.now() }
window.addEventListener('mousemove', e => {
  POINTER.ndc.x = (e.clientX / window.innerWidth) * 2 - 1
  POINTER.ndc.y = -((e.clientY / window.innerHeight) * 2 - 1)
  POINTER.active = true; POINTER.lastMove = performance.now()
}, { passive: true })
window.addEventListener('mouseout', () => { POINTER.active = false }, { passive: true })

const _ndc = new THREE.Vector3(), _dir = new THREE.Vector3(), _target = new THREE.Vector3()
function updatePointer() {
  _target.set(0, 0, 0)
  if (POINTER.active) {
    _ndc.set(POINTER.ndc.x, POINTER.ndc.y, 0.5).unproject(camera)
    _dir.copy(_ndc).sub(camera.position).normalize()
    const denom = _dir.z
    if (Math.abs(denom) > 1e-4) {
      const t = -camera.position.z / denom
      if (t > 0 && Number.isFinite(t)) _target.copy(camera.position).addScaledVector(_dir, t)
    }
  }
  POINTER.world.lerp(_target, 0.12)
  const idle = (performance.now() - POINTER.lastMove) / 1000
  const want = (POINTER.active && idle < 3) ? 1 : 0
  POINTER.activity += (want - POINTER.activity) * 0.06
}

// ---------------------------------------------------------------------------
// Storm geometry / material
// ---------------------------------------------------------------------------
const stormVertexShader = `
uniform float uTime; uniform float uSize; uniform float uBlowUp;
uniform vec3 uCursor; uniform float uRepelRadius; uniform float uRepelStrength; uniform float uActivity;
uniform vec3 uCore; uniform vec3 uMid; uniform vec3 uRim;
attribute float aScale; attribute float aNoise; attribute float aRadialPush; attribute float aMix;
varying vec3 vColor; varying float vBlowUp;
void main() {
  vec3 pos = position;

  // Per-particle in/out wobble.
  float t = uTime * 1.4 + aNoise * 6.2831;
  float wobble = sin(t) * 0.1 * aRadialPush;
  pos *= 1.0 + wobble;

  // Slow secondary swirl on xz.
  float swirlAngle = uTime * 0.05 + aNoise * 6.2831;
  mat2 swirl = mat2(cos(swirlAngle), -sin(swirlAngle), sin(swirlAngle), cos(swirlAngle));
  pos.xz = swirl * pos.xz;

  // Blow-up — radial explosion with a squared falloff.
  vec3 outward = normalize(pos + vec3(0.0001));
  float blow = uBlowUp * uBlowUp;
  pos += outward * blow * (10.0 + aNoise * 18.0) * aRadialPush;

  vec4 modelPosition = modelMatrix * vec4(pos, 1.0);

  vec3 toParticle = modelPosition.xyz - uCursor;
  float dist = length(toParticle);
  float falloff = smoothstep(uRepelRadius, 0.0, dist);
  modelPosition.xyz += normalize(toParticle + vec3(0.0001)) * falloff * uRepelStrength * uActivity;

  vec4 viewPosition = viewMatrix * modelPosition;
  gl_Position = projectionMatrix * viewPosition;
  gl_PointSize = uSize * aScale;
  gl_PointSize *= (1.0 / -viewPosition.z);

  // Three-stop radial gradient (aMix = biased radius 0..1).
  float t1 = smoothstep(0.25, 0.85, aMix);
  vec3 mix1 = mix(uCore, uMid, t1);
  float t2 = clamp((aMix - 0.7) * 3.0, 0.0, 1.0);
  vColor = mix(mix1, uRim, t2);
  vBlowUp = uBlowUp;
}
`

const stormFragmentShader = `
uniform float uOpacity; uniform float uBrightness;
varying vec3 vColor; varying float vBlowUp;
void main() {
  vec2 uv = gl_PointCoord - 0.5;
  float d = length(uv);
  if (d > 0.5) discard;
  float strength = pow(1.0 - d * 2.0, 4.5);
  vec3 color = mix(vec3(0.0), vColor, strength);
  float blowFade = 1.0 - smoothstep(0.15, 1.0, vBlowUp);
  gl_FragColor = vec4(color * uBrightness, strength * uOpacity * blowFade);
}
`

class Storm {
  constructor() {
    const count = 50000, radius = 2.5
    const positions = new Float32Array(count * 3)
    const scales = new Float32Array(count)
    const noises = new Float32Array(count)
    const radialPush = new Float32Array(count)
    const mixv = new Float32Array(count)
    for (let i = 0; i < count; i++) {
      const i3 = i * 3
      let u, v, s
      do { u = Math.random() * 2 - 1; v = Math.random() * 2 - 1; s = u * u + v * v } while (s >= 1 || s === 0)
      const factor = 2 * Math.sqrt(1 - s)
      const dx = u * factor, dy = v * factor, dz = 1 - 2 * s
      const rN = Math.pow(Math.random(), 0.4)
      const r = radius * (0.55 + rN * 0.45)
      positions[i3] = dx * r; positions[i3 + 1] = dy * r; positions[i3 + 2] = dz * r
      mixv[i] = rN
      scales[i] = 0.45 + Math.random() * 0.8
      noises[i] = Math.random()
      radialPush[i] = 0.4 + rN * 1.1
    }

    const geometry = new THREE.BufferGeometry()
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3))
    geometry.setAttribute('aScale', new THREE.Float32BufferAttribute(scales, 1))
    geometry.setAttribute('aNoise', new THREE.Float32BufferAttribute(noises, 1))
    geometry.setAttribute('aRadialPush', new THREE.Float32BufferAttribute(radialPush, 1))
    geometry.setAttribute('aMix', new THREE.Float32BufferAttribute(mixv, 1))

    this.uniforms = {
      uTime:          { value: 0 },
      uSize:          { value: CONFIG.pointSize },
      uOpacity:       { value: 0 },
      uBlowUp:        { value: CONFIG.blowUp },
      uCursor:        { value: new THREE.Vector3() },
      uRepelRadius:   { value: CONFIG.repelRadius },
      uRepelStrength: { value: CONFIG.repelStrength },
      uActivity:      { value: 0 },
      uCore:          { value: hexToVec3(CONFIG.coreColor) },
      uMid:           { value: hexToVec3(CONFIG.midColor) },
      uRim:           { value: hexToVec3(CONFIG.rimColor) },
      uBrightness:    { value: CONFIG.brightness },
    }

    const material = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: this.uniforms,
      vertexShader: stormVertexShader,
      fragmentShader: stormFragmentShader,
    })

    this.points = new THREE.Points(geometry, material)
    this.points.layers.enable(LAYERS.ENTIRE_SCENE)

    this.group = new THREE.Group()
    this.group.add(this.points)
    scene.add(this.group)

    this.appearStart = performance.now()
    this.t0 = performance.now() / 1000
  }

  render(scroll, m) {
    const t = performance.now() / 1000
    const dt = Math.min(0.05, t - this.t0); this.t0 = t
    this.uniforms.uTime.value = t
    camera.position.set(m.x * CONFIG.parallax, m.y * CONFIG.parallax, 7 - scroll * CONFIG.scrollDive)
    camera.lookAt(0, 0, 0)
    this.group.scale.setScalar(1 + scroll * CONFIG.scrollGrow)
    const elapsed = performance.now() - this.appearStart
    const fade = Math.max(0, Math.min(1, (elapsed - 300) / 1400))
    this.uniforms.uOpacity.value = fade * CONFIG.opacity
    this.uniforms.uBlowUp.value = CONFIG.blowUp
    this.uniforms.uCursor.value.copy(POINTER.world)
    this.uniforms.uActivity.value = POINTER.activity
    this.group.rotation.y += dt * (CONFIG.spin + scroll * CONFIG.scrollSpin)
    this.group.rotation.x += dt * CONFIG.spin * 0.33
  }
}

const sceneObj = new Storm()

// ---------------------------------------------------------------------------
// Ambient atmosphere motes
// ---------------------------------------------------------------------------
const atmoVertexShader = `
attribute float size; attribute float seed; uniform float uTime; uniform vec2 uRes;
varying float vA;
vec3 warp(vec3 p, float t){ float c=0.9,a=1.9,b=0.02,s=0.05; p*=2.;
  p.x+=c*sin(s*t+a*p.y)+t*b; p.y+=c*cos(s*t+a*p.x); p.y+=c*sin(s*t+a*p.z)+t*b;
  p.z+=c*cos(s*t+a*p.y); p.z+=c*sin(s*t+a*p.x)+t*b; p.x+=c*cos(s*t+a*p.z);
  return cos(p+vec3(1,2,4)); }
void main(){
  vec3 v = position*4.0 + warp(position, uTime)*1.2;
  vec4 mv = modelViewMatrix * vec4(v, 1.0);
  float r = length(v); float farF = 1.0 - smoothstep(5.0, 6.5, r); float nearF = smoothstep(0.0, 0.5, -mv.z);
  vA = farF * nearF;
  gl_PointSize = size * uRes.y / 900.0 / -mv.z; gl_PointSize = max(gl_PointSize, 1.0);
  gl_Position = projectionMatrix * mv;
}
`

const atmoFragmentShader = `
uniform vec3 uColor; varying float vA;
void main(){ vec2 p = gl_PointCoord - 0.5; float l = length(p); if (l > 0.5) discard;
  float tex = smoothstep(0.5, 0.0, l); gl_FragColor = vec4(uColor * tex, tex * vA * 0.6); }
`

const N = Math.round(CONFIG.atmoCount)
const atmoPositions = new Float32Array(N * 3), atmoSizes = new Float32Array(N), atmoSeeds = new Float32Array(N)
for (let i = 0; i < N; i++) {
  atmoPositions[i * 3] = 2 * Math.random() - 1
  atmoPositions[i * 3 + 1] = 2 * Math.random() - 1
  atmoPositions[i * 3 + 2] = 2 * Math.random() - 1
  atmoSizes[i] = CONFIG.atmoSize * (0.4 + Math.random())
  atmoSeeds[i] = Math.random()
}

const atmoGeometry = new THREE.BufferGeometry()
atmoGeometry.setAttribute('position', new THREE.Float32BufferAttribute(atmoPositions, 3))
atmoGeometry.setAttribute('size', new THREE.Float32BufferAttribute(atmoSizes, 1))
atmoGeometry.setAttribute('seed', new THREE.Float32BufferAttribute(atmoSeeds, 1))

const atmoMat = new THREE.ShaderMaterial({
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  depthTest: false,
  uniforms: {
    uTime: { value: 0 },
    uColor: { value: hexToVec3(CONFIG.atmoColor) },
    uRes: { value: new THREE.Vector2(initW * window.devicePixelRatio, initH * window.devicePixelRatio) }
  },
  vertexShader: atmoVertexShader,
  fragmentShader: atmoFragmentShader,
})

const atmoPoints = new THREE.Points(atmoGeometry, atmoMat)
atmoPoints.frustumCulled = false
atmoPoints.layers.enable(LAYERS.ENTIRE_SCENE)
scene.add(atmoPoints)

// ---------------------------------------------------------------------------
// Composite / corner-flame FinalPass
// ---------------------------------------------------------------------------
const FinalPass = {
  uniforms: {
    iTime: { value: 0 },
    tDiffuse: { value: null }, torusTexture: { value: null }, bloomTexture: { value: null }, haloTexture: { value: null },
    uBg: { value: hexToVec3(CONFIG.bgColor) },
    uFlameA: { value: hexToVec3(CONFIG.flameColor) },
    uFlameB: { value: hexToVec3(CONFIG.flameColor2) },
    uFlameAmt: { value: CONFIG.flameAmt }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }`,
  fragmentShader: `
uniform float iTime; uniform sampler2D tDiffuse; uniform sampler2D bloomTexture; uniform sampler2D torusTexture; uniform sampler2D haloTexture;
uniform vec3 uBg; uniform vec3 uFlameA; uniform vec3 uFlameB; uniform float uFlameAmt;
varying vec2 vUv;
vec3 warp3d(vec3 pos, float t){ float curv=.8,a=1.9,b=0.7; pos*=2.;
  pos.x+=curv*sin(t+a*pos.y)+t*b; pos.y+=curv*cos(t+a*pos.x);
  pos.y+=curv*sin(t+a*pos.z)+t*b; pos.z+=curv*cos(t+a*pos.y);
  pos.z+=curv*sin(t+a*pos.x)+t*b; pos.x+=curv*cos(t+a*pos.z);
  return 0.5+0.5*cos(pos.xyz+vec3(1,2,4)); }
void main(){
  vec2 uv = 2.*vUv - 1.;
  vec3 w = pow(warp3d(vec3(uv.x, sin(uv.y), uv.y), iTime*1.5), vec3(1.5));
  vec3 flame = 1.5*uFlameA*w.x; flame*=w.y; flame += uFlameB*w.z;
  flame *= smoothstep(0.25, 1., abs(uv.y));
  float md = smoothstep(-0.7, 1., -uv.y*uv.x); flame *= md*md;
  vec3 bg = uBg * (1.0 - 0.4 * length(uv));
  vec3 halo = texture2D(haloTexture, vUv).xyz;
  gl_FragColor = vec4(bg + flame*uFlameAmt + texture2D(bloomTexture, vUv).xyz + texture2D(torusTexture, vUv).xyz + texture2D(tDiffuse, vUv).xyz + halo, 1.);
}
`
}

// haloTexture is unused but referenced by the shader; supply an empty black texture
// so texture2D() has something valid to sample.
const haloTex = new THREE.DataTexture(new Uint8Array([0, 0, 0, 0]), 1, 1)
haloTex.needsUpdate = true
FinalPass.uniforms.haloTexture.value = haloTex

atmoPoints.onBeforeRender = () => {
  const t = performance.now() / 1000
  atmoMat.uniforms.uTime.value = t * CONFIG.atmoSpeed * 8.0
  atmoPoints.position.copy(camera.position)
  FinalPass.uniforms.iTime.value = t
}

// ---------------------------------------------------------------------------
// Postprocessing
// ---------------------------------------------------------------------------
const renderScene = new RenderPass(scene, camera)

const torusComposer = new EffectComposer(renderer)
torusComposer.renderToScreen = false
torusComposer.addPass(renderScene)
torusComposer.addPass(new ShaderPass(GammaCorrectionShader))
torusComposer.addPass(new UnrealBloomPass(new THREE.Vector2(initW, initH), 0.22, 0.2, 0))
torusComposer.addPass(new ShaderPass(CopyShader))

const bloomComposer = new EffectComposer(renderer)
bloomComposer.renderToScreen = false
bloomComposer.addPass(renderScene)
bloomComposer.addPass(new UnrealBloomPass(new THREE.Vector2(initW, initH), 0.4, 0.55, 0))
bloomComposer.addPass(new ShaderPass(GammaCorrectionShader))

const finalPass = new ShaderPass(FinalPass)
const finalComposer = new EffectComposer(renderer)
finalComposer.addPass(renderScene)
finalComposer.addPass(finalPass)

finalPass.uniforms.bloomTexture.value = bloomComposer.renderTarget1.texture
finalPass.uniforms.torusTexture.value = torusComposer.renderTarget1.texture

// ---------------------------------------------------------------------------
// Scroll
// ---------------------------------------------------------------------------
const Lerp = (a, b, t) => a + (b - a) * t
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v))
let scrollTarget = 0, scrollSmooth = 0, scrollCurrent = 0
const mouseSmooth = { x: 0, y: 0 }

function updateScroll() {
  const max = document.documentElement.scrollHeight - window.innerHeight
  scrollTarget = max > 0 ? clamp(window.scrollY / max, 0, 1) : 0
}
window.addEventListener('scroll', updateScroll, { passive: true })
updateScroll()

// ---------------------------------------------------------------------------
// Resize
// ---------------------------------------------------------------------------
function onResize() {
  // Clamp to 1px: a transient 0×0 layout read (embed/iframe resize races,
  // devtools panel toggling) would otherwise hand WebGL a zero-size
  // framebuffer and spam GL_INVALID_FRAMEBUFFER_OPERATION every frame.
  const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight)
  renderer.setPixelRatio(window.devicePixelRatio)
  renderer.setSize(w, h)
  camera.aspect = w / h
  camera.updateProjectionMatrix()
  torusComposer.setPixelRatio(window.devicePixelRatio)
  torusComposer.setSize(w, h)
  bloomComposer.setPixelRatio(window.devicePixelRatio)
  bloomComposer.setSize(w, h)
  finalComposer.setPixelRatio(window.devicePixelRatio)
  finalComposer.setSize(w, h)
  atmoMat.uniforms.uRes.value.set(w * window.devicePixelRatio, h * window.devicePixelRatio)
  updateScroll()
}
window.addEventListener('resize', onResize, { passive: true })

// ---------------------------------------------------------------------------
// Theo — virtual assistant demo
//
// A simulated assistant, not a real one: a fixed script of messages cycled
// on click. No AI API, no network call, no external dependency — this is a
// UX demo of "a 3D object as an assistant", not a chat feature.
// ---------------------------------------------------------------------------
const THEO_MESSAGES = [
  'Hallo! Schön, dass du da bist.',
  'Ich bin Theo, dein virtueller Assistent bei Mirage Data.',
  'Ich kann mit deiner zukünftigen Website verbunden werden und deine Kunden bei Fragen, IT-Support und digitalen Anliegen unterstützen.',
  'Ich kann kurze Vorschläge geben, Orientierung schaffen und als erster digitaler Ansprechpartner funktionieren.',
  'Wenn du das Formular ausfüllst, kann ich dir zeigen, welche Vorteile Digitalisierung für dein Business haben kann.',
  'Lass uns herausfinden, wie Mirage Data dein Unternehmen digital stärker machen kann.',
]

const theoEl = {
  hitzone: document.getElementById('theo-hitzone'),
  hint: document.getElementById('theo-hint'),
  wrap: document.getElementById('theo-bubble-wrap'),
  bubble: document.getElementById('theo-bubble'),
}

const theoState = { index: 0, hasInteracted: false, hideTimer: 0 }

function theoHideBubble() {
  theoEl.wrap.classList.remove('visible')
  theoEl.wrap.setAttribute('aria-hidden', 'true')
}

// Reading time scales with message length (~230ms/word — a bit slower than
// average silent-reading speed, since this pops in mid-scroll) so the two
// longest scripted messages don't get cut off before they're readable.
function theoScheduleHide(ms) {
  clearTimeout(theoState.hideTimer)
  theoState.hideTimer = setTimeout(theoHideBubble, ms)
}

function theoShowMessage() {
  const message = THEO_MESSAGES[theoState.index]
  theoEl.bubble.textContent = message
  theoState.index = (theoState.index + 1) % THEO_MESSAGES.length
  theoEl.wrap.classList.add('visible')
  theoEl.wrap.setAttribute('aria-hidden', 'false')

  if (!theoState.hasInteracted) {
    theoState.hasInteracted = true
    theoEl.hint.classList.remove('visible', 'pulse')
  }

  const wordCount = message.trim().split(/\s+/).length
  theoScheduleHide(clamp(wordCount * 230, 2600, 7000))
}

theoEl.hitzone.addEventListener('click', theoShowMessage)
theoEl.hitzone.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); theoShowMessage() }
})

// Pause the auto-hide while the visitor is actually reading the bubble
// (pointer hover or keyboard focus inside it); resume with a short grace
// period after they leave, instead of losing the message outright.
theoEl.wrap.addEventListener('mouseenter', () => clearTimeout(theoState.hideTimer))
theoEl.wrap.addEventListener('mouseleave', () => theoScheduleHide(1800))
theoEl.wrap.addEventListener('focusin', () => clearTimeout(theoState.hideTimer))
theoEl.wrap.addEventListener('focusout', () => theoScheduleHide(1800))

// A gentle one-time invite, once the storm has visibly appeared — dismissed
// permanently on first interaction.
setTimeout(() => {
  if (!theoState.hasInteracted) theoEl.hint.classList.add('visible', 'pulse')
}, 2200)

// Keep the hitzone / hint / bubble glued to the orb's actual on-screen
// position and apparent size as it scrolls, grows and sways with parallax.
const _theoWorld = new THREE.Vector3()
const _theoLast = { x: NaN, y: NaN, r: NaN }
function updateTheoPosition() {
  sceneObj.group.updateMatrixWorld()
  _theoWorld.set(0, 0, 0).applyMatrix4(sceneObj.group.matrixWorld)
  const dist = Math.max(0.5, camera.position.distanceTo(_theoWorld))

  _theoWorld.project(camera)
  const vw = window.innerWidth, vh = window.innerHeight
  const x = (_theoWorld.x * 0.5 + 0.5) * vw
  const y = (1 - (_theoWorld.y * 0.5 + 0.5)) * vh

  const worldRadius = 2.5 * sceneObj.group.scale.x
  const vFov = camera.fov * Math.PI / 180
  const pxPerWorldUnit = vh / (2 * Math.tan(vFov / 2) * dist)
  const screenRadius = clamp(worldRadius * pxPerWorldUnit, 60, vh * 0.42)

  // The lerped scroll/parallax values settle asymptotically near rest —
  // skip the DOM writes once sub-pixel, rather than writing the same
  // style string every frame indefinitely.
  if (
    Math.abs(x - _theoLast.x) < 0.5 &&
    Math.abs(y - _theoLast.y) < 0.5 &&
    Math.abs(screenRadius - _theoLast.r) < 0.5
  ) return
  _theoLast.x = x; _theoLast.y = y; _theoLast.r = screenRadius

  theoEl.hitzone.style.left = x + 'px'
  theoEl.hitzone.style.top = y + 'px'
  theoEl.hitzone.style.width = screenRadius * 2 + 'px'
  theoEl.hitzone.style.height = screenRadius * 2 + 'px'

  // Anchors sit above the orb's top edge and grow upward (translateY(-100%)),
  // so on a tall/narrow viewport where that edge is near y=0 they'd clip off
  // screen — keep a safe top margin for the hint pill and the (taller,
  // multi-line) bubble + name label.
  const hintTop = Math.max(56, y - screenRadius - 16)
  const bubbleTop = Math.max(108, y - screenRadius - 14)

  theoEl.hint.style.left = x + 'px'
  theoEl.hint.style.top = hintTop + 'px'

  const bubbleX = clamp(x, 92, vw - 92)
  theoEl.wrap.style.left = bubbleX + 'px'
  theoEl.wrap.style.top = bubbleTop + 'px'
}

// ---------------------------------------------------------------------------
// Render loop
// ---------------------------------------------------------------------------
function render() {
  requestAnimationFrame(render)
  scrollSmooth  = Lerp(scrollSmooth, scrollTarget, 0.10)
  scrollCurrent = Lerp(scrollCurrent, scrollSmooth, 0.06)
  mouseSmooth.x = Lerp(mouseSmooth.x, POINTER.ndc.x, 0.06)
  mouseSmooth.y = Lerp(mouseSmooth.y, POINTER.ndc.y, 0.06)
  updatePointer()
  sceneObj.render(scrollCurrent, mouseSmooth)
  updateTheoPosition()

  camera.layers.set(LAYERS.TORUS_SCENE);  torusComposer.render()
  camera.layers.set(LAYERS.BLOOM_SCENE);  bloomComposer.render()
  camera.layers.set(LAYERS.ENTIRE_SCENE); finalComposer.render()
}

// Expose for debugging/verification.
window.__storm = { sceneObj, get scrollCurrent() { return scrollCurrent }, camera, torusComposer, bloomComposer, finalComposer, renderer, THREE, theoState }

render()
</script>
</body>
</html>
